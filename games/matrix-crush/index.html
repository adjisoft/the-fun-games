<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matrix Crush (Classic)</title>
    <style>
      :root {
        --bg: #040a05;
        --grid: rgba(0, 255, 128, 0.08);
        --neon: #22ff99;
        --neon-soft: rgba(34, 255, 153, 0.55);
        --panel: rgba(0, 20, 8, 0.8);
      }
      * {
        box-sizing: border-box;
        font-family: "Consolas", "Menlo", "Courier New", monospace;
      }
      body {
        margin: 0;
        background:
          linear-gradient(transparent 95%, rgba(34, 255, 153, 0.06) 96%) 0 0/100% 24px,
          linear-gradient(90deg, transparent 95%, rgba(34, 255, 153, 0.06) 96%) 0 0/24px 100%,
          var(--bg);
        color: var(--neon);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 6vw;
      }
      a {
        color: var(--neon);
        text-decoration: none;
        border: 1px solid var(--neon-soft);
        padding: 6px 12px;
      }
      .meta {
        font-size: 12px;
        color: rgba(34, 255, 153, 0.7);
      }
      #game-shell {
        margin: 0 6vw 30px;
        border: 1px solid var(--neon-soft);
        background: var(--panel);
        position: relative;
        overflow: hidden;
        min-height: 70vh;
      }
      #glcanvas {
        display: block;
        width: 100%;
        height: 70vh;
      }
      #loader {
        position: absolute;
        inset: 0;
        background: rgba(0, 10, 5, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      .button {
        cursor: pointer;
        border: 1px solid var(--neon);
        background: transparent;
        color: var(--neon);
        padding: 8px 14px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div>Matrix Crush (Classic)</div>
        <div class="meta">Old version of Matrix Crushed - ASCII puzzle</div>
      </div>
      <div class="toolbar">
        <a href="../../">Back to Vault</a>
        <button id="fullscreen" class="button">Fullscreen</button>
      </div>
    </header>

    <div id="game-shell">
      <div id="loader">
        <div>
          <div>Booting Matrix Crush...</div>
          <div class="meta">(0_0) Anonymous is syncing the grid</div>
        </div>
      </div>
      <canvas id="glcanvas"></canvas>
    </div>

    <script src="./mq_js_bundle.js"></script>
    <script>
      const loader = document.getElementById("loader");
      const gameCanvas = document.getElementById("glcanvas");
      const shell = document.getElementById("game-shell");
      const fullscreenBtn = document.getElementById("fullscreen");

      const resize = () => {
        gameCanvas.width = shell.clientWidth;
        gameCanvas.height = shell.clientHeight;
      };
      window.addEventListener("resize", resize);
      resize();

      fullscreenBtn.addEventListener("click", async () => {
        if (!document.fullscreenElement) {
          await shell.requestFullscreen();
          resize();
        } else {
          await document.exitFullscreen();
          resize();
        }
      });

      if (typeof load !== "function") {
        loader.textContent = "Loader JS tidak ditemukan (mq_js_bundle.js).";
      } else {
        try {
          load("matrix_crushed.wasm");
          setTimeout(() => loader.classList.add("hidden"), 800);
        } catch (err) {
          console.error(err);
          loader.textContent =
            "Failed to load game files. Pastikan mq_js_bundle.js dan matrix_crushed.wasm ada.";
        }
      }
    </script>
  </body>
</html>
